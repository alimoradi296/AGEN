[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agen"
version = "0.1.0"
description = "Reliable workflow execution core for Django + Celery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Django>=4.2",
    "celery>=5.3",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "pytest-celery>=1.0",
    "freezegun>=1.4",
    "black",
    "ruff",
]
metrics = [
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agen*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
