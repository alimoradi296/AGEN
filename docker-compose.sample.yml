# docker-compose.sample.yml
#
# Copy this file to docker-compose.yml and adjust for your environment.
#
#   cp docker-compose.sample.yml docker-compose.yml
#
# Then build your own image or replace the `build: .` lines with your
# own image reference. You will need:
#   - Python 3.10+
#   - Django 4.2+, Celery 5.3+, psycopg2-binary 2.9+
#   - All packages from pyproject.toml installed
#
# Quick start:
#   docker compose up -d
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py createsuperuser
#   docker compose exec web python manage.py start_onboarding --user-id alice

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agen
      POSTGRES_USER: agen
      POSTGRES_PASSWORD: agen
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agen -d agen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --save 900 1
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .                          # or: image: your-registry/your-image:tag
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: demo_project.settings
      PYTHONPATH: /app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: demo_project.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A demo_project.celery worker -l info -c 2

  dispatcher:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: demo_project.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: python manage.py agen_dispatcher

  beat:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: demo_project.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A demo_project.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  pg_data:
  redis_data:
